services:
  postgres:
    image: postgres:16-alpine
    ports: ["35432:5432"]
    environment:
      POSTGRES_USER: stc
      POSTGRES_PASSWORD: stc_secret
      POSTGRES_DB: stc
    volumes: [stc_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["36379:6379"]
    volumes: [stc_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  stc_postgres_data:
  stc_redis_data:

networks:
  default:
    name: stc-network
