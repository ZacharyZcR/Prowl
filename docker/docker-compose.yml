name: prowl

services:
  postgres:
    image: postgres:16-alpine
    ports: ["35432:5432"]
    environment:
      POSTGRES_USER: prowl
      POSTGRES_PASSWORD: prowl_secret
      POSTGRES_DB: prowl
    volumes: [prowl_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prowl"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["36379:6379"]
    volumes: [prowl_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  prowl_postgres_data:
  prowl_redis_data:

networks:
  default:
    name: prowl-network
