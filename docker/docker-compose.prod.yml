services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports: ["38080:38080"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://prowl:${DB_PASSWORD:-prowl_secret}@postgres:5432/prowl?sslmode=disable
      REDIS_URL: redis:6379
      LISTEN_ADDR: ":38080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GIN_MODE: release
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["80:80"]
    restart: unless-stopped
    depends_on:
      - backend
