services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports: ["38080:38080"]
    environment:
      DATABASE_URL: postgres://prowl:prowl_secret@postgres:5432/prowl?sslmode=disable
      REDIS_URL: redis:6379
      LISTEN_ADDR: ":38080"
      JWT_SECRET: dev-jwt-secret-change-in-production
      GIN_MODE: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports: ["35173:80"]
    environment:
      VITE_API_URL: http://localhost:38080
    depends_on:
      - backend
