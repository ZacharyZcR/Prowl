version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/backend/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/cli/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cli-dependencies:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/backend/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
