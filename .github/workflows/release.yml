name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-backend:
    name: Docker Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/zacharyzcr/prowl-backend:${{ github.ref_name }}
            ghcr.io/zacharyzcr/prowl-backend:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}

  docker-frontend:
    name: Docker Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/zacharyzcr/prowl-admin:${{ github.ref_name }}
            ghcr.io/zacharyzcr/prowl-admin:latest

  docker-portal:
    name: Docker Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: portal/Dockerfile
          push: true
          tags: |
            ghcr.io/zacharyzcr/prowl-portal:${{ github.ref_name }}
            ghcr.io/zacharyzcr/prowl-portal:latest

  cli-release:
    name: CLI Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Build all platforms
        working-directory: cli
        run: |
          mkdir -p ../dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${pair%/*} GOARCH=${pair#*/} CGO_ENABLED=0 \
              go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
              -o ../dist/prowl-${pair%/*}-${pair#*/} ./cmd/prowl
          done
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o ../dist/prowl-windows-amd64.exe ./cmd/prowl
          ls -la ../dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
